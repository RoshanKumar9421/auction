<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Live Auction</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c1f19;--panel:#143127;--panel2:#1b3f33;--line:rgba(238,243,234,.13);
  --text:#eef3ea;--mute:#9bb3a6;--accent:#ffc93c;--ink:#1b1500;--go:#5fe3a1;--stop:#ff6b5e;
}
[data-theme="light"]{
  --bg:#edf1ea;--panel:#ffffff;--panel2:#f3f6f1;--line:rgba(16,38,30,.14);
  --text:#10261e;--mute:#566e62;--accent:#f0b400;--ink:#1b1500;--go:#0d8350;--stop:#d03a2d;
}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg)}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--text);line-height:1.45}
.app{min-height:100vh;background:var(--bg);color:var(--text);transition:background .4s}
.disp{font-family:'Big Shoulders Display',Impact,sans-serif;font-weight:800;letter-spacing:.01em;line-height:.95}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mute{color:var(--mute)}
.wrap{max-width:1500px;margin:0 auto;padding:0 20px}

/* header */
.top{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:16px;padding:12px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.brand h1{font-size:34px;text-transform:uppercase}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--go)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--go);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:500;background:var(--panel)}
.chip b{font-weight:700;margin-left:4px}
button.chip:hover{border-color:var(--accent)}
.btn{padding:9px 16px;border-radius:10px;border:1px solid var(--line);font-size:14px;font-weight:700;background:var(--panel);transition:border-color .15s,transform .1s}
.btn:hover{border-color:var(--accent)}.btn:active{transform:scale(.97)}
.btn.pri{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.btn.go{background:var(--go);color:#04210f;border-color:var(--go)}
.btn.bad{color:var(--stop);border-color:color-mix(in srgb,var(--stop) 45%,transparent)}
.btn.sm{padding:5px 10px;font-size:12px}
.icon{width:38px;height:38px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.ticker{overflow:hidden;white-space:nowrap;border-top:1px solid var(--line);font-size:13px;font-weight:500;padding:7px 0;position:relative;height:34px}
.ticker div{position:absolute;display:inline-flex;gap:48px;animation:scroll 40s linear infinite}
@keyframes scroll{from{transform:translateX(100vw)}to{transform:translateX(-100%)}}
.ticker em{font-style:normal;color:var(--accent);font-weight:700}

/* layout */
.main{display:grid;grid-template-columns:minmax(0,430px) minmax(0,1fr);gap:20px;padding:20px 0 40px;align-items:start}
@media(max-width:1000px){.main{grid-template-columns:1fr}.stage-col{position:static!important}}
.stage-col{position:sticky;top:116px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.sec-h h2{font-size:28px;text-transform:uppercase}

/* stage */
.stage{padding:22px;text-align:center}
.avatar{width:128px;height:128px;border-radius:50%;object-fit:cover;border:3px solid var(--accent);background:var(--panel2)}
.pname{font-size:clamp(44px,6vw,64px);text-transform:uppercase;margin:12px 0 10px}
.tags{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:18px}
.tag{padding:3px 10px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);font-size:12px;font-weight:700}
.score{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px 18px;display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px}
.score .lbl{font-size:13px;font-weight:700;text-align:left}
.score .num{font-size:92px;color:var(--accent);font-weight:900;font-variant-numeric:tabular-nums}
.bids{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}
.row{display:flex;gap:8px;margin-bottom:8px}
.input{flex:1;min-width:0;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-weight:700}
.waiting{padding:44px 10px}
.waiting p{font-size:15px}
.dots{display:flex;gap:5px;justify-content:center;margin-top:10px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--go);animation:pulse 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
.filters{display:flex;flex-wrap:wrap;gap:6px;padding:12px}
.filters button{padding:6px 12px;border-radius:8px;border:1px solid var(--line);font-size:13px;font-weight:700}
.filters button.on{background:var(--accent);color:var(--ink);border-color:var(--accent)}

/* teams */
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.team{position:relative;padding:16px 16px 14px 20px;border:1px solid var(--line);border-radius:14px;background:var(--panel);cursor:pointer;overflow:hidden;transition:border-color .15s}
.team::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:hsl(var(--h) 70% 58%)}
.team:hover{border-color:hsl(var(--h) 70% 58%)}
.team h3{font-size:30px;text-transform:uppercase;color:hsl(var(--h) 75% 62%);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
[data-theme="light"] .team h3{color:hsl(var(--h) 70% 36%)}
.team .budget{font-size:42px;font-weight:900;font-variant-numeric:tabular-nums}
.team .meta{font-size:12px;margin-top:2px}
.bar{height:6px;border-radius:99px;background:var(--panel2);margin:12px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:hsl(var(--h) 70% 58%);transition:width .8s}
.team .foot{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--mute)}
.sell{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--bg) 88%,transparent);opacity:0;transition:opacity .15s}
.team:hover .sell,.team:focus-within .sell{opacity:1}
.over{color:var(--stop)}

/* sales */
.sale{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.sale:last-child{border:0}
.sale img{width:38px;height:38px;border-radius:10px;background:var(--panel2)}
.sale .n{font-weight:700}.sale .t{font-size:13px}
.sale .a{margin-left:auto;font-size:28px;font-weight:900;color:var(--go)}
.empty{text-align:center;padding:28px 0;font-size:14px;color:var(--mute)}

/* overlays */
.ov{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:rgba(4,12,9,.9);padding:16px}
.modal{width:100%;max-width:640px;max-height:86vh;display:flex;flex-direction:column;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:18px;animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.mh{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.mh h2{font-size:30px;text-transform:uppercase}
.mb{padding:16px 20px;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
.li.hot{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.li b{font-size:14px}.li small{display:block;color:var(--mute);font-size:12px}
.li input{width:20px;height:20px;accent-color:var(--accent)}
.drawer{position:fixed;inset:0;z-index:90;display:flex;justify-content:flex-end;background:rgba(4,12,9,.6)}
.dr{width:100%;max-width:520px;height:100%;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;animation:slide .25s ease-out}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
.dr-h{padding:22px;border-bottom:1px solid var(--line)}
.dr-h h2{font-size:52px;text-transform:uppercase}
.lead{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.lead div{padding:10px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
.lead small{display:block;font-size:12px;color:var(--mute);font-weight:700}
.edit{padding:16px 22px;border-bottom:1px solid var(--line);display:grid;gap:8px;background:var(--panel2)}
.edit .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dr-l{flex:1;overflow-y:auto;padding:16px 22px;display:flex;flex-direction:column;gap:8px}
.pl{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
.pl .i{width:32px;height:32px;border-radius:8px;background:var(--accent);color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:900}
.pl .p{margin-left:auto;font-size:24px;font-weight:900;color:var(--go)}
select{padding:5px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:12px}
.reveal{text-align:center;animation:pop .5s cubic-bezier(.2,.8,.2,1)}
.reveal img{width:min(300px,60vw);height:min(300px,60vw);border-radius:50%;object-fit:cover;border:5px solid var(--accent);background:var(--panel2)}
.reveal h1{font-size:clamp(56px,11vw,130px);text-transform:uppercase;color:#fff;margin:18px 0 12px}
.spin{width:130px;height:130px;border-radius:50%;border:6px solid var(--line);border-top-color:var(--accent);animation:rot 0.8s linear infinite;margin:0 auto 24px}
@keyframes rot{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="root"></div>
{% verbatim %}
<script type="text/babel">
const { useEffect, useMemo, useRef, useState } = React;

const Ic = ({ d, s = 18 }) => (
  <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d={d} /></svg>
);
const P = {
  sun: "M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4",
  moon: "M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z",
  share: "M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M16 6l-4-4-4 4M12 2v14",
  dl: "M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3",
  x: "M18 6 6 18M6 6l12 12",
};

function getCookie(name) {
  const m = document.cookie.split(";").map(c => c.trim()).find(c => c.startsWith(name + "="));
  return m ? decodeURIComponent(m.slice(name.length + 1)) : null;
}

function ListModal({ title, players, onClose, onToggle, isDark }) {
  const [q, setQ] = useState("");
  const list = (players || []).filter(p => p.name.toLowerCase().includes(q.toLowerCase()));
  return (
    <div className="ov" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="mh">
          <div><h2 className="disp">{title}</h2><span className="mute" style={{fontSize:13}}>{list.length} players</span></div>
          <button className="btn icon" onClick={onClose} aria-label="Close"><Ic d={P.x} /></button>
        </div>
        <div style={{padding:"12px 20px 0"}}>
          <input className="input" style={{width:"100%"}} placeholder="Search by name" value={q} onChange={e => setQ(e.target.value)} />
        </div>
        <div className="mb">
          {list.length === 0 && <div className="empty">No players match.</div>}
          {list.map(p => (
            <div key={p.id} className={`li ${onToggle && p.priority_score > 0 ? "hot" : ""}`}>
              <div><b>{p.name}</b><small>{p.category || "Player"}</small></div>
              {onToggle && <input type="checkbox" checked={p.priority_score > 0} onChange={() => onToggle(p.id)} aria-label={`Prioritise ${p.name}`} />}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function App() {
  const [data, setData] = useState(null);
  const [isAdmin, setIsAdmin] = useState(false);
  const [isViewerMode, setIsViewerMode] = useState(false);
  const [theme, setTheme] = useState("dark");
  const [showPin, setShowPin] = useState(false);
  const [pinInput, setPinInput] = useState("");
  const [showShare, setShowShare] = useState(false);
  const [selectedTeam, setSelectedTeam] = useState(null);
  const [customBid, setCustomBid] = useState("");
  const [modal, setModal] = useState(null); // 'cheat' | 'remaining' | 'unsold'
  const [teamNameDraft, setTeamNameDraft] = useState("");
  const [captainDraft, setCaptainDraft] = useState("");
  const [viceDraft, setViceDraft] = useState("");
  const [transferPlayer, setTransferPlayer] = useState(null);
  const [transferTeamId, setTransferTeamId] = useState("");
  const [animStage, setAnimStage] = useState("idle");
  const [scrambleText, setScrambleText] = useState("Searching");
  const [tempWinner, setTempWinner] = useState(null);
  const [categoryFilter, setCategoryFilter] = useState("ALL");
  const prevPlayerId = useRef(null);

  const headersJSON = useMemo(() => ({ "Content-Type": "application/json", "X-CSRFToken": getCookie("csrftoken") }), []);
  const isDark = theme === "dark";

  useEffect(() => { if (new URLSearchParams(location.search).get("role") === "viewer") { setIsViewerMode(true); setIsAdmin(false); } }, []);
  useEffect(() => { const s = localStorage.getItem("auction_theme"); if (s === "light" || s === "dark") setTheme(s); }, []);
  useEffect(() => { localStorage.setItem("auction_theme", theme); }, [theme]);
  useEffect(() => {
    if (animStage !== "spinning") return;
    const w = ["Searching", "Matching", "Targeting", "Scanning", "Locking in"];
    const t = setInterval(() => setScrambleText(w[Math.floor(Math.random() * w.length)]), 120);
    return () => clearInterval(t);
  }, [animStage]);

  const getImg = (p) => !p ? "" : (p.image && p.image.length > 5
    ? `/proxy-image/?url=${encodeURIComponent(p.image)}`
    : `https://api.dicebear.com/9.x/initials/svg?seed=${encodeURIComponent(p.name || "Player")}`);

  const fetchData = async () => {
    try {
      const d = await (await fetch("/api/state/")).json();
      if (d.error) return;
      setData(d);
      if (d.current_player && d.current_player.id !== prevPlayerId.current) {
        if (prevPlayerId.current !== null) { setTempWinner(d.current_player); setAnimStage("revealed"); }
        prevPlayerId.current = d.current_player.id;
      } else if (!d.current_player) {
        prevPlayerId.current = null;
        if (animStage !== "spinning") setAnimStage("idle");
      }
    } catch (e) { console.error("State Sync Error", e); }
  };
  useEffect(() => { fetchData(); const t = setInterval(fetchData, 1000); return () => clearInterval(t); }, [animStage, isAdmin, isViewerMode]);

  const doAction = async (action, payload = {}) => {
    try {
      if (!isAdmin) return;
      if (action === "SPIN") {
        setAnimStage("spinning");
        await fetch("/api/action/", { method: "POST", headers: headersJSON, body: JSON.stringify({ action, category: categoryFilter }) });
        setTimeout(async () => {
          const nd = await (await fetch("/api/state/")).json();
          setData(nd); setTempWinner(nd.current_player); setAnimStage("revealed");
          if (nd.current_player) prevPlayerId.current = nd.current_player.id;
        }, 1200);
        return;
      }
      await fetch("/api/action/", { method: "POST", headers: headersJSON, body: JSON.stringify({ action, ...payload }) });
      fetchData();
    } catch (e) { console.error("Action Error", e); }
  };

  const togglePriority = async (id) => {
    try {
      setData({ ...data, all_unsold_players: (data.all_unsold_players || []).map(p => p.id === id ? { ...p, priority_score: p.priority_score > 0 ? 0 : 1 } : p) });
      await fetch("/api/toggle-priority/", { method: "POST", headers: headersJSON, body: JSON.stringify({ player_id: id }) });
    } catch (e) { console.error("Priority Toggle Error", e); }
  };

  const verifyAdmin = async () => {
    try {
      const json = await (await fetch("/api/verify-pin/", { method: "POST", headers: headersJSON, body: JSON.stringify({ pin: pinInput }) })).json();
      if (json.success) { setIsAdmin(true); setShowPin(false); setPinInput(""); }
      else { alert("Incorrect PIN. Try again."); setPinInput(""); }
    } catch (e) { alert("Could not reach the server."); }
  };

  const shareLink = (type) => {
    const url = `${location.origin}${location.pathname}${type === "viewer" ? "?role=viewer" : ""}`;
    const text = type === "captain" ? `🧢 Join the auction (captain): ${url}` : `👀 Watch the live auction: ${url}`;
    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, "_blank");
  };

  const submitCustomBid = () => {
    const n = parseInt(customBid);
    if (isNaN(n)) return;
    doAction("BID", { amount: n }); setCustomBid("");
  };

  useEffect(() => {
    if (!selectedTeam) return;
    setTeamNameDraft(selectedTeam.name || ""); setCaptainDraft(selectedTeam.captain_name || ""); setViceDraft(selectedTeam.vice_captain_name || "");
  }, [selectedTeam]);

  const saveRoles = async () => {
    try {
      if (!selectedTeam) return;
      await fetch("/api/assign-roles/", { method: "POST", headers: headersJSON, body: JSON.stringify({ team_id: selectedTeam.id, team_name: teamNameDraft, captain: captainDraft, vice_captain: viceDraft }) });
      fetchData(); setSelectedTeam(null);
    } catch (e) { console.error("Role Save Error", e); }
  };

  const handleTransfer = async () => {
    if (!transferPlayer || !transferTeamId) return;
    await doAction("TRANSFER", { player_name: transferPlayer.player_name, old_team: selectedTeam.name, new_team_id: transferTeamId });
    setTransferPlayer(null); setTransferTeamId("");
  };

  if (!data) return <div data-theme={theme} className="app" style={{display:"grid",placeItems:"center"}}><div className="disp" style={{fontSize:48}}>Loading auction…</div></div>;

  const { current_player, current_bid, teams = [], history = [], stats = {}, auction_name, categories } = data;
  const categoryList = ["ALL", ...(categories || [])];
  const sortedHistory = [...history].reverse();
  const feed = sortedHistory.slice(0, 14);
  const ticker = sortedHistory.slice(0, 30);
  const teamSales = selectedTeam ? sortedHistory.filter(h =>
    (h.team_id && h.team_id === selectedTeam.id) ||
    (h.team_name && selectedTeam.name && h.team_name.trim().toLowerCase() === selectedTeam.name.trim().toLowerCase())) : [];
  const closeReveal = () => { setAnimStage("idle"); setTempWinner(null); };

  return (
    <div data-theme={theme} className="app">

      {/* reveal */}
      {(animStage === "spinning" || animStage === "revealed") && (
        <div className="ov" style={{zIndex:200}} onClick={isAdmin ? closeReveal : undefined}>
          {animStage === "spinning" ? (
            <div style={{textAlign:"center"}}>
              <div className="spin" />
              <div className="disp" style={{fontSize:56,color:"#fff",textTransform:"uppercase"}}>{scrambleText}…</div>
            </div>
          ) : tempWinner && (
            <div className="reveal">
              <img src={getImg(tempWinner)} alt="" />
              <h1 className="disp">{tempWinner.name}</h1>
              <div className="tags">
                {[tempWinner.position, tempWinner.category, tempWinner.department, tempWinner.year].filter(Boolean).map((t, i) => (
                  <span key={i} className="tag" style={{fontSize:15,padding:"5px 14px",background:i === 1 ? "var(--accent)" : "var(--panel2)",color:i === 1 ? "var(--ink)" : "var(--text)"}}>{t}</span>
                ))}
              </div>
              {isAdmin
                ? <button className="btn pri" style={{fontSize:18,padding:"14px 40px"}} onClick={e => { e.stopPropagation(); closeReveal(); }}>Open bidding</button>
                : <p className="mute">Waiting for the auctioneer…</p>}
            </div>
          )}
        </div>
      )}

      {/* header */}
      <header className="top">
        <div className="wrap">
          <div className="top-row">
            <div className="brand">
              <h1 className="disp">{auction_name}</h1>
              <span className="live"><i />Live</span>
            </div>
            <div className="chips">
              <button className="chip" onClick={() => setModal("remaining")}>Remaining<b>{stats.remaining || 0}</b></button>
              <button className="chip" onClick={() => setModal("unsold")}>Unsold<b>{stats.unsold || 0}</b></button>
              <span className="chip">{isViewerMode ? "Viewer" : isAdmin ? "Admin" : "Console"}</span>
            </div>
            <div style={{display:"flex",gap:8,alignItems:"center"}}>
              {isAdmin && <button className="btn" onClick={() => setModal("cheat")}>Priority players</button>}
              <button className="btn icon" onClick={() => setTheme(isDark ? "light" : "dark")} aria-label="Toggle theme"><Ic d={isDark ? P.sun : P.moon} /></button>
              {isAdmin && <>
                <button className="btn icon" onClick={() => setShowShare(true)} aria-label="Share links"><Ic d={P.share} /></button>
                <a className="btn icon" href="/export/" aria-label="Export CSV"><Ic d={P.dl} /></a>
              </>}
              {!isViewerMode && (
                <button className={`btn ${isAdmin ? "bad" : "pri"}`} onClick={() => isAdmin ? setIsAdmin(false) : setShowPin(true)}>
                  {isAdmin ? "Exit admin" : "Admin login"}
                </button>
              )}
            </div>
          </div>
        </div>
        <div className="ticker"><div>
          {ticker.length ? ticker.map((h, i) => (
            <span key={i}>{h.player_name} sold to <em>{h.team_name}</em> for ${h.amount}</span>
          )) : <span>Waiting for the first sale</span>}
        </div></div>
      </header>

      <main className="wrap main">
        {/* on the block */}
        <section className="stage-col">
          <div className="card stage">
            {!current_player ? (
              <div className="waiting">
                {isAdmin ? (
                  <>
                    <p className="mute" style={{marginBottom:18}}>No player on the block.{categoryFilter !== "ALL" ? ` Drawing from ${categoryFilter}.` : ""}</p>
                    <button className="btn pri disp" style={{fontSize:30,padding:"12px 44px"}} onClick={() => doAction("SPIN")}>Draw next player</button>
                  </>
                ) : (
                  <>
                    <div className="disp" style={{fontSize:40}}>Next player soon</div>
                    <p className="mute" style={{marginTop:6}}>The auctioneer is picking the next name.</p>
                  </>
                )}
              </div>
            ) : (
              <>
                <img className="avatar" src={getImg(current_player)} alt="" />
                <h2 className="pname disp">{current_player.name}</h2>
                <div className="tags">
                  {[current_player.position, current_player.category, current_player.department, current_player.year].filter(Boolean).map((t, i) => <span key={i} className="tag">{t}</span>)}
                </div>
                <div className="score">
                  <div className="lbl">Current bid<div className="mute" style={{fontWeight:500,marginTop:2}}>Base {current_player.base_price}</div></div>
                  <div className="num disp">{current_bid}</div>
                </div>
                {isAdmin ? (
                  <>
                    <div className="bids">
                      {[1, 5, 10, 50].map(a => <button key={a} className="btn" onClick={() => doAction("BID", { amount: current_bid + a })}>+{a}</button>)}
                    </div>
                    <div className="row">
                      <input className="input" type="number" placeholder="Set exact bid" value={customBid} onChange={e => setCustomBid(e.target.value)} onKeyDown={e => e.key === "Enter" && submitCustomBid()} />
                      <button className="btn pri" onClick={submitCustomBid}>Set bid</button>
                    </div>
                    <button className="btn bad" style={{width:"100%"}} onClick={() => doAction("UNSOLD")}>Pass — mark unsold</button>
                    <p className="mute" style={{fontSize:12,marginTop:10}}>To sell, hover a team and press Sell.</p>
                  </>
                ) : (
                  <div style={{padding:"6px 0"}}><span style={{fontWeight:700,fontSize:14}}>Bidding is live</span><div className="dots"><i /><i /><i /></div></div>
                )}
              </>
            )}
          </div>

          {isAdmin && (
            <div className="card">
              <div className="filters">
                {categoryList.map(c => <button key={c} className={categoryFilter === c ? "on" : ""} onClick={() => setCategoryFilter(c)}>{c}</button>)}
              </div>
            </div>
          )}
          {isAdmin && <button className="btn go" onClick={() => doAction("RESET_UNSOLD")}>Put unsold players back in the pool</button>}
        </section>

        {/* teams + sales */}
        <section style={{display:"flex",flexDirection:"column",gap:20}}>
          <div className="card" style={{padding:20}}>
            <div className="sec-h"><h2 className="disp">Teams</h2><span className="mute" style={{fontSize:13}}>Select a team to see its squad</span></div>
            <div className="teams">
              {teams.map((team, idx) => {
                const isFull = team.players_count >= 8;
                return (
                  <div key={team.id} className="team" style={{"--h": (idx * 30) % 360}} onClick={() => setSelectedTeam(team)}>
                    {isAdmin && current_player && (
                      <div className="sell" onClick={e => e.stopPropagation()}>
                        {isFull
                          ? <span className="over" style={{fontWeight:700}}>Squad full</span>
                          : <button className="btn go" style={{fontSize:18,padding:"12px 36px"}} onClick={() => doAction("SELL", { team_id: team.id })}>Sell to {team.name}</button>}
                      </div>
                    )}
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
                      <div style={{minWidth:0}}>
                        <h3 className="disp">{team.name}</h3>
                        <div className="meta mute">C: {team.captain_name || "—"}</div>
                        <div className="meta mute">VC: {team.vice_captain_name || "—"}</div>
                      </div>
                      <div style={{textAlign:"right"}}>
                        <div className={`budget disp ${team.budget < 0 ? "over" : ""}`}>{team.budget}</div>
                        <div className="meta mute">{team.budget < 0 ? "Over budget" : "points left"}</div>
                      </div>
                    </div>
                    <div className="bar"><i style={{width: `${Math.min(100, (team.players_count / 8) * 100)}%`}} /></div>
                    <div className="foot"><span>{team.players_count}/8 players</span><span>Spent {team.spent}</span></div>
                  </div>
                );
              })}
            </div>
          </div>

          <div className="card" style={{padding:20}}>
            <div className="sec-h"><h2 className="disp">Recent sales</h2><span className="mute" style={{fontSize:13}}>Drawing from: {categoryFilter}</span></div>
            <div style={{maxHeight:340,overflowY:"auto"}}>
              {feed.length ? feed.map((h, i) => (
                <div key={i} className="sale">
                  <img alt="" src={`https://api.dicebear.com/9.x/initials/svg?seed=${encodeURIComponent(h.player_name || "P")}`} />
                  <div><div className="n">{h.player_name}</div><div className="t mute">to {h.team_name}</div></div>
                  <div className="a disp">${h.amount}</div>
                </div>
              )) : <div className="empty">No sales yet. The first one will show up here.</div>}
            </div>
          </div>
        </section>
      </main>

      {/* list modals */}
      {modal === "cheat" && <ListModal title="Priority players" players={data.all_unsold_players} onToggle={togglePriority} onClose={() => setModal(null)} />}
      {modal === "remaining" && <ListModal title="Remaining players" players={data.all_unsold_players} onClose={() => setModal(null)} />}
      {modal === "unsold" && <ListModal title="Unsold players" players={data.true_unsold_players} onClose={() => setModal(null)} />}

      {/* team drawer */}
      {selectedTeam && (
        <div className="drawer" onClick={() => setSelectedTeam(null)}>
          <div className="dr" onClick={e => e.stopPropagation()}>
            <div className="dr-h">
              <div style={{display:"flex",justifyContent:"space-between",gap:12}}>
                <div><h2 className="disp">{selectedTeam.name}</h2><span className="mute" style={{fontSize:13}}>{teamSales.length} players bought</span></div>
                <button className="btn icon" onClick={() => setSelectedTeam(null)} aria-label="Close"><Ic d={P.x} /></button>
              </div>
              <div className="lead">
                <div><small>Captain</small><b>{selectedTeam.captain_name || "Not assigned"}</b></div>
                <div><small>Vice captain</small><b>{selectedTeam.vice_captain_name || "Not assigned"}</b></div>
              </div>
            </div>
            {isAdmin && (
              <div className="edit">
                <input className="input" value={teamNameDraft} onChange={e => setTeamNameDraft(e.target.value)} placeholder="Team name" />
                <div className="two">
                  <input className="input" value={captainDraft} onChange={e => setCaptainDraft(e.target.value)} placeholder="Captain" />
                  <input className="input" value={viceDraft} onChange={e => setViceDraft(e.target.value)} placeholder="Vice captain" />
                </div>
                <button className="btn pri" onClick={saveRoles}>Save team details</button>
              </div>
            )}
            <div className="dr-l">
              {teamSales.map((p, i) => (
                <div key={i} className="pl">
                  <div className="i disp">{i + 1}</div>
                  <b style={{fontSize:14}}>{p.player_name}</b>
                  <div className="p disp">${p.amount}</div>
                  {isAdmin && (
                    <div style={{display:"flex",flexDirection:"column",gap:4}}>
                      <select value={transferPlayer?.player_name === p.player_name ? transferTeamId : ""} onChange={e => { setTransferPlayer(p); setTransferTeamId(e.target.value); }}>
                        <option value="">Move to…</option>
                        {teams.filter(t => t.id !== selectedTeam.id).map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                      </select>
                      {transferPlayer?.player_name === p.player_name && transferTeamId && <button className="btn go sm" onClick={handleTransfer}>Confirm move</button>}
                    </div>
                  )}
                </div>
              ))}
              {teamSales.length === 0 && <div className="empty">No players yet.</div>}
            </div>
          </div>
        </div>
      )}

      {/* share */}
      {showShare && (
        <div className="ov" onClick={() => setShowShare(false)}>
          <div className="modal" style={{maxWidth:380,padding:24,gap:12}} onClick={e => e.stopPropagation()}>
            <h2 className="disp" style={{fontSize:34,textTransform:"uppercase"}}>Invite people</h2>
            <p className="mute" style={{fontSize:14}}>Send a link on WhatsApp.</p>
            <button className="btn go" onClick={() => shareLink("captain")}>Send captain link</button>
            <button className="btn" onClick={() => shareLink("viewer")}>Send viewer link</button>
            <button className="btn" onClick={() => setShowShare(false)}>Close</button>
          </div>
        </div>
      )}

      {/* pin */}
      {showPin && (
        <div className="ov" style={{zIndex:300}}>
          <div className="modal" style={{maxWidth:380,padding:28,gap:14,textAlign:"center"}}>
            <h2 className="disp" style={{fontSize:36,textTransform:"uppercase"}}>Admin PIN</h2>
            <input className="input" type="password" maxLength="6" autoFocus value={pinInput} onChange={e => setPinInput(e.target.value)} onKeyDown={e => e.key === "Enter" && verifyAdmin()} style={{textAlign:"center",fontSize:30,letterSpacing:".4em",flex:"none"}} aria-label="Admin PIN" />
            <button className="btn pri" onClick={verifyAdmin}>Sign in</button>
            <button className="btn" onClick={() => setShowPin(false)}>Cancel</button>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
{% endverbatim %}
</body>
</html>
